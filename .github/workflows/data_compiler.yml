name: Daily Mutual Fund Data Compiler

on:
  schedule:
    # Run daily at 02:00 AM UTC (7:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering of the compiler from the GitHub Actions tab

permissions:
  contents: write

jobs:
  compile-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install database compilation dependencies (Streamlit is bypassed to speed up execution)
        pip install pandas numpy yfinance requests

    - name: Run Data Compiler
      run: python generate_data.py

    - name: Commit and Push compiled mf_universe_data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add mf_universe_data.json
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update compiled mutual fund universe [skip ci]"
          git push
        else
          echo "No database changes detected. Skipping push."
        fi
